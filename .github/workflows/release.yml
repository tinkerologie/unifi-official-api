name: Release

# Bumping __version__ on main releases that version. A v* tag or a manual run does the
# same, so a failed release can be retried.
on:
  push:
    branches: [main]
    paths:
      - src/unifi_official_api/_version.py
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read # jobs request only what they need

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Skip the release when PyPI already has this version: a comment edit or a revert
  # of _version.py must not publish, and every later job needs this one.
  resolve:
    name: Resolve version
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read # read _version.py
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.pypi.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read package version
        id: version
        run: |
          version="$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' src/unifi_official_api/_version.py)"
          if [ -z "$version" ]; then
            echo "::error::Could not parse __version__"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether PyPI has this version
        id: pypi
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 "https://pypi.org/pypi/unifi-official-api/$VERSION/json")"
          case "$status" in
            200)
              echo "::notice::$VERSION is already on PyPI; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "release=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::PyPI returned HTTP $status"
              exit 1
              ;;
          esac

  # Run tests before releasing
  test:
    name: Test
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  # Build distribution packages
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python -c '
          import os, pathlib, re, sys
          version_text = pathlib.Path("src/unifi_official_api/_version.py").read_text(encoding="utf-8")
          match = re.search(r"__version__\s*=\s*\"([^\"]+)\"", version_text)
          assert match is not None, "Could not parse __version__"
          pkg_version = match.group(1)
          tag_name = os.environ["TAG_NAME"]
          tag_version = tag_name.removeprefix("v")
          if pkg_version != tag_version:
              sys.stderr.write(f"Tag {tag_name} does not match __version__ {pkg_version}\n")
              sys.exit(1)
          '

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Smoke-test built wheel in clean virtual environment
        run: |
          python -m venv /tmp/wheel-smoke-venv
          /tmp/wheel-smoke-venv/bin/pip install dist/*.whl
          /tmp/wheel-smoke-venv/bin/python -c "import unifi_official_api; assert unifi_official_api.__version__"

      - name: Store distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  # Publish to PyPI using Trusted Publishers (OIDC)
  # See: https://docs.pypi.org/trusted-publishers/
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/unifi-official-api
    permissions:
      id-token: write # Required for trusted publishing

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Create GitHub Release
  github-release:
    name: GitHub Release
    needs: [resolve, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # Created at this commit when it does not exist. A tag made with the job's
          # token starts no workflow, so this cannot release twice.
          tag_name: v${{ needs.resolve.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
