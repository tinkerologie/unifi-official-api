name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read # jobs request only what they need

jobs:
  # Run tests before releasing
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  # Build distribution packages
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Verify release tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python -c '
          import os, pathlib, re, sys
          version_text = pathlib.Path("src/unifi_official_api/_version.py").read_text(encoding="utf-8")
          match = re.search(r"__version__\s*=\s*\"([^\"]+)\"", version_text)
          assert match is not None, "Could not parse __version__"
          pkg_version = match.group(1)
          tag_name = os.environ["TAG_NAME"]
          tag_version = tag_name.removeprefix("v")
          if pkg_version != tag_version:
              sys.stderr.write(f"Tag {tag_name} does not match __version__ {pkg_version}\n")
              sys.exit(1)
          '

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Smoke-test built wheel in clean virtual environment
        run: |
          python -m venv /tmp/wheel-smoke-venv
          /tmp/wheel-smoke-venv/bin/pip install dist/*.whl
          /tmp/wheel-smoke-venv/bin/python -c "import unifi_official_api; assert unifi_official_api.__version__"

      - name: Store distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  # Publish to PyPI using Trusted Publishers (OIDC)
  # See: https://docs.pypi.org/trusted-publishers/
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/unifi-official-api
    permissions:
      id-token: write # Required for trusted publishing

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Create GitHub Release
  github-release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
